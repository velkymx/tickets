services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # In-network service names — set literally so a developer's local .env
      # (DB_HOST=127.0.0.1, QUEUE=sync, …) can't leak in via interpolation.
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    volumes:
      # Serve the code that the image built (vendor + public/build), not the host.
      # app-code is seeded from the image on first up; run `docker compose down -v`
      # after a rebuild to pick up new code.
      - app-code:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tickets

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app-code:/var/www/html:ro
      - storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tickets

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_DATABASE: "${DB_DATABASE:-tickets}"
      MYSQL_USER: "${DB_USERNAME:-tickets}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tickets

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tickets

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - app-code:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tickets

networks:
  tickets:
    driver: bridge

volumes:
  app-code:
    driver: local
  storage:
    driver: local
  mariadb:
    driver: local
  redis:
    driver: local
